[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "osint-lab"
version = "1.3.0"
description = "Laboratorio OSINT local con casos, evidencia aislada y reportes"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["rich>=13.7"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "bandit>=1.7", "pip-audit>=2.7"]

[project.scripts]
osint-lab = "app.main:main"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM"]
ignore = ["S603", "S607"]
